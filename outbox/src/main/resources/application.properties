quarkus.application.name=outbox
# Esquema de portas da formação: <aula><seq> → 4100 app, 4101 Postgres (host), 4102 debug (host), 4103 testes
quarkus.http.port=4100
quarkus.http.test-port=4103
quarkus.analytics.disabled=true

# --- Banco (slide 14) ---------------------------------------------------------
# Sem URL configurada, o Dev Services sobe um PostgreSQL em container no
# ./mvnw quarkus:dev e nos testes (precisa de Docker). No ambiente do professor,
# o docker-compose injeta QUARKUS_DATASOURCE_JDBC_URL/USERNAME/PASSWORD e o
# Quarkus usa o container "db" (o Dev Services nem é acionado).
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:16-alpine

# Hibernate cria pedido e outbox a partir das entidades; import.sql cria inbox e
# faturamento (slide 14: "complete o schema com a turma").
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql
# Mostrar o SQL no console durante a demo (ver os dois INSERTs no mesmo commit)
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.format-sql=false

# Transações JTA (Narayana): 30 s é o padrão; explícito para a turma ver a chave
quarkus.transaction-manager.default-transaction-timeout=30s

quarkus.smallrye-openapi.info-title=Pedidos com Transactional Outbox / Inbox
quarkus.swagger-ui.always-include=true

quarkus.log.category."br.com.fiap".level=DEBUG

# Dev Container: aceitar conexões de fora do contêiner
quarkus.http.host=0.0.0.0
